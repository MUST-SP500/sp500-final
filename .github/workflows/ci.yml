name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Python 版本由 .python-version 决定，环境由 uv.lock 复现
      - name: 安装 uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: 按 uv.lock 同步环境
        run: uv sync --frozen

      - name: 运行测试
        run: uv run pytest -q

      - name: 管道自检
        run: uv run python -m src.pipeline --check

      - name: 锁定文件未过期
        run: uv lock --check
