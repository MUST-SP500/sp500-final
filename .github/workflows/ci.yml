name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv 会读 .python-version 自己准备 Python，不需要 actions/setup-python
      # --frozen：严格按 uv.lock 装，lock 过期就直接报错，防止环境和文档说的不一致
      - name: 安装依赖
        run: uv sync --frozen

      - name: 运行测试
        run: uv run pytest

      - name: 管道自检
        run: uv run main.py --check
