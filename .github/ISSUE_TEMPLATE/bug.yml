name: 问题
description: 报告一个 bug 或阻碍
title: "[fix] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: 期望是什么
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行 `python -m src.pipeline --stage features`
        2. 看到报错 ...
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: "Windows 11 / Python 3.11 / pandas 2.2.3"
