[project]
name = "sp500-final"
version = "0.1.0"
description = "S&P 500 周频择时：从数据到决策（数据科学开源工具 · Final Project）"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "pyyaml>=6.0,<7",
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
    "pyarrow>=15.0,<22",
    "yfinance>=0.2.40,<0.3",
]

[project.optional-dependencies]
# 只有做深度学习（PCA/DNN/CNN/Autoencoder）的人需要装这一组，
# 默认 uv sync 不会下 PyTorch，跑主流程也用不到。
dl = ["torch>=2.2,<3"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "jupyterlab>=4.0,<5",
]

[tool.uv]
# 这不是一个要被安装的库，只是一个跑脚本的项目：
# 关掉打包，uv sync 只装依赖、不 build 自己。
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
