[project]
name = "sp500-final"
version = "0.1.0"
description = "S&P 500 周频择时策略 · MUST 数据科学开源工具 Final Project"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "pyyaml>=6.0,<7",
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
    "pyarrow>=15.0,<22",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.uv]
# 不做成可安装的包：源码通过仓库根目录 + tests/conftest.py 的 sys.path 注入导入
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
